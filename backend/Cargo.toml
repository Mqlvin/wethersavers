[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.8"
base64 = "0.22.1"
dashmap = "6.1.0"
flate2 = "1.1.9"
mime_guess = "2.0.5"
once_cell = "1.21.3"
regex = "1.12.3"
reqwest = { version = "0.13.2" }
rust-embed = "8.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["full"] }
tower-http = { version = "0.6.8", features = ["cors"] }
